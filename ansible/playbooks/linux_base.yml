---
# Configuration de base de LINUX01 : identités, permissions, service web, stockage, pare-feu, exporter.
# Rejouable : un second passage doit afficher changed=0.
- name: LINUX01 - configuration de base
  hosts: linux01
  gather_facts: true

  vars:
    base_packages: [curl, vim, htop, acl, ufw, nginx, prometheus-node-exporter]
    lab_groups: [webadmins, auditeurs]
    lab_users:
      - { name: alice, groups: [webadmins], comment: "Alice - admin web" }
      - { name: bruno, groups: [webadmins], comment: "Bruno - admin web" }
      - { name: chloe, groups: [auditeurs, systemd-journal], comment: "Chloe - auditrice (lecture des journaux)" }
    web_root: /var/www/infraready
    # Message publié sur la page d'accueil et vérifié en fin de play (séance 4, scénarios 1, 2, 6)
    site_message: "Site InfraReady déployé par Ansible depuis OPS01"
    data_label: DATA
    data_mount: /data

  tasks:
    - name: Fuseau horaire
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Paquets de base
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Groupes du labo
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: "{{ lab_groups }}"

    - name: Utilisateurs du labo (sans mot de passe, connexion par su/sudo uniquement)
      ansible.builtin.user:
        name: "{{ item.name }}"
        comment: "{{ item.comment }}"
        groups: "{{ item.groups }}"
        append: true
        shell: /bin/bash
        password: "!"
        update_password: on_create
      loop: "{{ lab_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Racine du site - écriture réservée à webadmins (setgid)
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: root
        group: webadmins
        mode: "2775"

    - name: Page d'accueil du site
      ansible.builtin.template:
        src: index.html.j2
        dest: "{{ web_root }}/index.html"
        owner: root
        group: webadmins
        mode: "0664"

    - name: Virtual host nginx
      ansible.builtin.template:
        src: nginx-infraready.conf.j2
        dest: /etc/nginx/sites-available/infraready
        mode: "0644"
      notify: Recharger nginx

    - name: Activer le site InfraReady
      ansible.builtin.file:
        src: /etc/nginx/sites-available/infraready
        dest: /etc/nginx/sites-enabled/infraready
        state: link
      notify: Recharger nginx

    - name: Désactiver le site par défaut
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Recharger nginx

    - name: Services actifs au démarrage
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [nginx, prometheus-node-exporter]

    # Le paquet recommandé ipmitool (via prometheus-node-exporter-collectors) installe le service openipmi :
    # aucun matériel IPMI dans une VM, il échoue à chaque démarrage (séance 6, preuves P-80 et P-80b).
    - name: Service openipmi désactivé (aucun matériel IPMI dans une VM)
      ansible.builtin.systemd_service:
        name: openipmi
        enabled: false
      notify: Effacer l'échec enregistré d'openipmi

    - name: Disque de données monté par UUID
      when: ansible_devices.sdb is defined
      block:
        - name: Récupérer l'UUID du système de fichiers DATA
          ansible.builtin.command: blkid -L {{ data_label }}
          register: data_dev
          changed_when: false
          check_mode: false   # lecture seule : exécutée aussi en --check (sinon UUID vide, faux changement)

        - name: Lire l'UUID
          ansible.builtin.command: blkid -s UUID -o value {{ data_dev.stdout }}
          register: data_uuid
          changed_when: false
          check_mode: false   # lecture seule : exécutée aussi en --check (sinon UUID vide, faux changement)

        - name: Monter le disque de données via fstab - {{ data_mount }}
          ansible.posix.mount:
            path: "{{ data_mount }}"
            src: "UUID={{ data_uuid.stdout }}"
            fstype: ext4
            opts: defaults,nofail
            state: mounted

        - name: Dossier des rapports - lecture pour auditeurs uniquement
          ansible.builtin.file:
            path: "{{ data_mount }}/rapports"
            state: directory
            owner: root
            group: auditeurs
            mode: "2750"

    # Pare-feu : uniquement ce dont le labo a besoin
    - name: UFW - SSH depuis le sous-réseau du labo
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ lab_subnet }}"

    - name: UFW - HTTP depuis le sous-réseau du labo
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp
        src: "{{ lab_subnet }}"

    - name: UFW - node_exporter depuis OPS01 uniquement
      community.general.ufw:
        rule: allow
        port: "9100"
        proto: tcp
        src: "{{ ops_ip }}"

    - name: UFW - politique par défaut et activation
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # Vérifications — les handlers (rechargement nginx) sont exécutés AVANT les tests ; sinon un test en échec
    # interrompt le play et le rechargement notifié n'a jamais lieu (incident phase H, preuve P-72a).
    - name: Appliquer les rechargements en attente avant les vérifications
      ansible.builtin.meta: flush_handlers

    - name: Le site répond en HTTP 200
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/"
        status_code: 200
        return_content: true
      register: page_check
      delegate_to: localhost
      become: false
      check_mode: false   # lecture seule : le contrôle reste exécuté en --check

    # Un HTTP 200 ne prouve pas que le bon contenu est publié (séance 4, scénario 6)
    - name: Le message attendu est publié
      ansible.builtin.assert:
        that:
          - site_message in page_check.content
        fail_msg: "Le message attendu est absent de la page."
        success_msg: "Le contenu attendu est publié."

    - name: Les métriques node_exporter sont exposées
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9100/metrics"
        status_code: 200
      delegate_to: localhost
      become: false
      check_mode: false   # lecture seule : le contrôle reste exécuté en --check

  handlers:
    - name: Recharger nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Effacer l'échec enregistré d'openipmi
      ansible.builtin.command: systemctl reset-failed openipmi.service  # noqa: command-instead-of-module
      changed_when: true
